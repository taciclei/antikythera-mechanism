name = "antikythera"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Antikythera"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
warningAsError = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Antikythera"
